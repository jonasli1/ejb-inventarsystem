services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventarsystem
      POSTGRES_PASSWORD: inventarsystem
      POSTGRES_DB: inventarsystem
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inventarsystem']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://inventarsystem:inventarsystem@postgres:5432/inventarsystem?schema=public
    ports:
      - '3000:3000'

volumes:
  postgres_data:

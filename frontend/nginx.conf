server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/locations.conf;
}

# HTTPS: always enabled. docker-entrypoint.d/10-self-signed-cert.sh generates
# a self-signed certificate on first start if no real one was supplied under
# /etc/nginx/certs, so this block always has something valid to load - see
# the README for how to install a real certificate instead.
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/locations.conf;
}
